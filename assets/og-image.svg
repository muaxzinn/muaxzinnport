<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Tagline & Text Gradient -->
    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Ambient Cyan Glow -->
    <radialGradient id="glowCyan" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#070b16" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Emerald Glow -->
    <radialGradient id="glowEmerald" cx="85%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#070b16" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Texture Overlay -->
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Ambient Blur Spheres -->
  <circle cx="240" cy="180" r="320" fill="url(#glowCyan)" />
  <circle cx="1020" cy="460" r="340" fill="url(#glowEmerald)" />

  <!-- Outer Frame Border -->
  <rect x="16" y="16" width="1168" height="598" rx="28" fill="none" stroke="url(#cardBorder)" stroke-width="2" />

  <!-- Decorative Circuit Traces in Background -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 80 180 H 140 L 170 210" />
    <circle cx="80" cy="180" r="4" fill="#38bdf8" />
    <path d="M 620 120 H 680 L 710 150" />
    <circle cx="710" cy="150" r="4" fill="#34d399" />
    <path d="M 1120 220 H 1060 L 1030 190" />
    <circle cx="1120" cy="220" r="4" fill="#818cf8" />
  </g>

  <!-- ================= LEFT COLUMN ================= -->
  <!-- Top Location / Status Pill -->
  <g transform="translate(70, 72)">
    <rect x="0" y="0" width="460" height="38" rx="19" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="20" cy="19" r="5" fill="#34d399" />
    <circle cx="20" cy="19" r="9" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Prompt', sans-serif" font-size="13" font-weight="700" fill="#7dd3fc" letter-spacing="0.5">
      SYSTEMS &amp; EMBEDDED DEVELOPER · NARATHIWAT
    </text>
  </g>

  <!-- Main Person Name -->
  <text x="70" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Firman Awea
  </text>

  <!-- Tagline Gradient -->
  <text x="70" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="800" fill="url(#taglineGrad)" letter-spacing="-0.5">
    Logic. Hardware. Intelligence.
  </text>

  <!-- Summary Description -->
  <text x="70" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Prompt', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    นักพัฒนาระบบและสมองกลฝังตัว มุ่งเน้นการสร้างสถาปัตยกรรมระบบจริง
  </text>
  <text x="70" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Prompt', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    เชื่อมต่อ Edge AI, Computer Vision, ไมโครคอนโทรลเลอร์ ESP32 และ Medical IoT
  </text>

  <!-- 4 Core Domain Chips -->
  <g transform="translate(70, 360)">
    <!-- Chip 1: AI & Vision -->
    <g transform="translate(0, 0)">
      <rect width="260" height="44" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="22" r="5" fill="#38bdf8" />
      <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Prompt', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
        AI (Machine Learning &amp; Vision)
      </text>
    </g>

    <!-- Chip 2: Coding & Architecture -->
    <g transform="translate(276, 0)">
      <rect width="280" height="44" rx="12" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="22" r="5" fill="#14b8a6" />
      <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Prompt', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
        Coding &amp; System Architecture
      </text>
    </g>

    <!-- Chip 3: Intelligent Systems & IoT -->
    <g transform="translate(0, 56)">
      <rect width="260" height="44" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="22" r="5" fill="#818cf8" />
      <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Prompt', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
        Intelligent Systems &amp; IoT
      </text>
    </g>

    <!-- Chip 4: Medical AI -->
    <g transform="translate(276, 56)">
      <rect width="280" height="44" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="22" r="5" fill="#f59e0b" />
      <text x="36" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Prompt', sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">
        AI ทางการแพทย์ (Medical AI)
      </text>
    </g>
  </g>

  <!-- Bottom Authority Bar -->
  <g transform="translate(70, 520)">
    <text font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#64748b">
      STACK: <tspan fill="#38bdf8">C/C++ Embedded</tspan> · <tspan fill="#34d399">ESP32 FreeRTOS</tspan> · <tspan fill="#a78bfa">TensorFlow.js</tspan> · <tspan fill="#f59e0b">Supabase Realtime</tspan>
    </text>
  </g>

  <!-- ================= RIGHT COLUMN (SHOWCASE BENTO CARD) ================= -->
  <g transform="translate(710, 64)">
    <!-- Bento Card Container -->
    <rect width="420" height="500" rx="24" fill="#0b1329" fill-opacity="0.9" stroke="url(#cardBorder)" stroke-width="2" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.6))" />

    <!-- Card Top Header -->
    <g transform="translate(28, 28)">
      <rect width="364" height="40" rx="10" fill="#070b16" stroke="#1e293b" stroke-width="1" />
      <circle cx="20" cy="20" r="4" fill="#ef4444" />
      <circle cx="34" cy="20" r="4" fill="#f59e0b" />
      <circle cx="48" cy="20" r="4" fill="#10b981" />
      <text x="70" y="25" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94a3b8">
        muaxzinn.github.io/muaxzinnport
      </text>
    </g>

    <!-- Center Icon Showcase -->
    <g transform="translate(210, 180)">
      <!-- Outer Hex Shield -->
      <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40"
               fill="#070b16"
               stroke="url(#taglineGrad)"
               stroke-width="3" />

      <!-- Glowing Core Aura -->
      <circle cx="0" cy="0" r="46" fill="#38bdf8" fill-opacity="0.12" />

      <!-- Monogram Glyph -->
      <g filter="url(#neonGlow)">
        <path d="M -30 -36 V 36 H -16 V 4 H 14 V -10 H -16 V -22 H 24 V -36 Z" fill="#38bdf8" />
        <path d="M 6 -6 L 28 36 H 42 L 20 -6 Z" fill="#34d399" />
        <polygon points="0,4 6,12 0,20 -6,12" fill="#ffffff" />
      </g>
    </g>

    <!-- Handle & Title in Card -->
    <text x="210" y="295" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">
      Firman Awea (@muaxzinn)
    </text>
    <text x="210" y="318" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#38bdf8">
      STATUS: ACTIVE · DEV CORE ONLINE
    </text>

    <!-- 4 Stats Matrix Grid -->
    <g transform="translate(28, 345)">
      <!-- Stat 1 -->
      <g transform="translate(0, 0)">
        <rect width="174" height="60" rx="12" fill="#070b16" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#ffffff">25+</text>
        <text x="16" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748b">PROJECTS BUILT</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(190, 0)">
        <rect width="174" height="60" rx="12" fill="#070b16" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#38bdf8">3.95</text>
        <text x="16" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748b">GPAX (SCI-MATH)</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(0, 70)">
        <rect width="174" height="60" rx="12" fill="#070b16" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#34d399">4</text>
        <text x="16" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748b">MAJOR AWARDS</text>
      </g>

      <!-- Stat 4 -->
      <g transform="translate(190, 70)">
        <rect width="174" height="60" rx="12" fill="#070b16" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="28" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" fill="#a78bfa">100%</text>
        <text x="16" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#64748b">MODULAR WEB</text>
      </g>
    </g>
  </g>
</svg>
