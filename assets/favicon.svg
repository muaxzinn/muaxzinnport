<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f" />
      <stop offset="50%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Neon Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Core Brand Cyan Gradient -->
    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="brandEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Center Flare -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#070b16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Glow Behind Core -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Subtle Circuit Traces -->
  <g opacity="0.35" stroke="url(#borderGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Circuit Nodes -->
    <path d="M120 140 H180 L210 170" />
    <circle cx="120" cy="140" r="5" fill="#38bdf8" />

    <path d="M392 140 H332 L302 170" />
    <circle cx="392" cy="140" r="5" fill="#818cf8" />

    <!-- Bottom Circuit Nodes -->
    <path d="M120 372 H190 L220 342" />
    <circle cx="120" cy="372" r="5" fill="#34d399" />

    <path d="M392 372 H322 L292 342" />
    <circle cx="392" cy="372" r="5" fill="#38bdf8" />
  </g>

  <!-- Central Hexagonal Neural Shield -->
  <polygon points="256,96 384,170 384,342 256,416 128,342 128,170"
           fill="none"
           stroke="url(#borderGrad)"
           stroke-width="6"
           stroke-linejoin="round"
           opacity="0.6" />

  <!-- Inner Dynamic Monogram (Stylized F & M Hardware Core) -->
  <g filter="url(#neonGlow)">
    <!-- Main Left Stem (F spine) -->
    <path d="M184 156 V356 H216 V272 H272 V242 H216 V186 H296 V156 Z"
          fill="url(#brandCyan)" />

    <!-- Dynamic M-Vector Overlap / Wing -->
    <path d="M256 196 L312 356 H344 L288 196 Z"
          fill="url(#brandEmerald)" />

    <path d="M280 236 L328 156 H360 L312 236 Z"
          fill="url(#brandCyan)" />

    <!-- Central Micro-Core Diamond -->
    <polygon points="256,236 272,256 256,276 240,256"
             fill="#ffffff" />
    
    <!-- Accent Spark Nodes -->
    <circle cx="296" cy="156" r="6" fill="#67e8f9" />
    <circle cx="272" cy="242" r="5" fill="#34d399" />
    <circle cx="184" cy="356" r="6" fill="#38bdf8" />
    <circle cx="344" cy="356" r="6" fill="#6ee7b7" />
  </g>
</svg>
